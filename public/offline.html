<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" />
    <title>Stacc — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0a1628;color:#e0e3e5;font-family:system-ui,sans-serif;text-align:center}.mark{width:72px;height:72px;margin:auto}.panel{max-width:360px}h1{margin:28px 0 8px;font-size:22px}p{margin:0;color:#9aabba;line-height:1.6;font-size:14px}button{margin-top:24px;min-height:48px;padding:0 20px;border:0;background:#ff6b35;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="panel">
      <img class="mark" src="/icon.svg" alt="Stacc" />
      <h1>You’re offline</h1>
      <p>Reconnect to continue your roadmap. Your saved progress will still be here.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
